<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>AI Agent Developer 황화인 포트폴리오</title>
<link rel="stylesheet" href="assets/style.css" />
<style>
  body { background: #F3F3F8; }
  .hub { max-width: 1400px; margin: 0 auto; padding: 40px 30px; }
  .hub h1 { font-size: 36px; margin-bottom: 10px; }
  .hub .sub { color: #4B4B55; margin-bottom: 24px; font-size: 18px; }
  .slide-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 18px; }
  .slide-card {
    background: #fff; border-radius: 14px; overflow: hidden;
    box-shadow: 0 6px 20px rgba(20,20,30,0.10);
    text-decoration: none; color: inherit; display: block;
    transition: transform 0.2s, box-shadow 0.2s;
  }
  .slide-card:hover { transform: translateY(-3px); box-shadow: 0 12px 28px rgba(20,20,30,0.15); }
  .slide-card iframe {
    width: 1920px; height: 1080px;
    border: 0;
    transform: scale(0.18);
    transform-origin: top left;
    pointer-events: none;
  }
  .slide-card .frame-wrap {
    width: 100%; aspect-ratio: 16/9; position: relative; overflow: hidden; background: #fff;
  }
  .slide-card .frame-wrap iframe {
    position: absolute; top: 0; left: 0;
    transform-origin: top left;
  }
  .slide-card .caption {
    padding: 12px 16px; font-weight: 700; font-size: 16px; color: #111;
    border-top: 1px solid #EDEDF3;
  }
  .slide-card .caption span { color: var(--purple); font-weight: 800; margin-right: 8px; }

  .toolbar {
    display: flex; gap: 12px; margin-bottom: 20px;
  }
  .toolbar a {
    padding: 8px 14px; border-radius: 8px;
    background: var(--purple); color: #fff; font-weight: 700;
    text-decoration: none; font-size: 15px;
  }
  .toolbar a.sec { background: #fff; color: var(--purple); border: 1px solid #D9CEFF; }
</style>
</head>
<body>
<div class="hub">
  <h1>AI Agent Developer 황화인 포트폴리오</h1>
  <div class="sub">1920×1080 HTML 슬라이드 23장 · 클릭 시 개별 페이지로 이동</div>

  <div class="toolbar">
    <a href="all.html">전체 보기 (스크롤)</a>
    <a class="sec" href="slides/s01.html">첫 슬라이드</a>
  </div>

  <div class="slide-grid" id="grid"></div>
</div>
<script>
  const titles = [
    ['01','커버 · AI AGENT 개발자 황화인'],
    ['02','5 Key Achievements · TRAINING & AWARD'],
    ['03','PROJECT 목록'],
    ['04','01 MEMORIA LABYRINTH 소개'],
    ['05','NPC AGENT WORK FLOW'],
    ['06','사람처럼 기억하는 NPC'],
    ['07','감정이 있는 NPC · NPC-NPC 인터럽트'],
    ['08','DeepEval + LangFuse 이중 품질 전략'],
    ['09','02 ALL FOR ONE 소개'],
    ['10','ALL FOR ONE WORK FLOW'],
    ['11','AI 자율 검증 & Context 최적화'],
    ['12','품질 보증 인프라 & 정량 성과'],
    ['13','도메인 특화 RAG SEARCH'],
    ['14','03 VOICE PHISHING PROTECTOR 소개'],
    ['15','PLM + LLM 하이브리드 아키텍처'],
    ['16','4단계 Robust JSON + 안면인식'],
    ['17','04 MULTIMODAL DEPRESSION CHECK'],
    ['18','XAI(Grad-CAM) 검증 · 3-Phase'],
    ['19','데이터 다단계 노이즈 제거'],
    ['20','THE FORGE - Multi-Agent Harness Pattern'],
    ['21','Cost-Efficient Harness on Harness'],
    ['22','Remote Control via Slack + File-System MQ'],
    ['23','Real-World Results']
  ];
  const grid = document.getElementById('grid');
  titles.forEach(([n, t]) => {
    const card = document.createElement('a');
    card.href = `slides/s${n}.html`;
    card.target = '_blank';
    card.className = 'slide-card';
    card.innerHTML = `
      <div class="frame-wrap">
        <iframe src="slides/s${n}.html" scrolling="no"></iframe>
      </div>
      <div class="caption"><span>${n}</span>${t}</div>
    `;
    grid.appendChild(card);
    // Scale iframe to fit container
    setTimeout(() => {
      const iframe = card.querySelector('iframe');
      const wrap = card.querySelector('.frame-wrap');
      const scale = wrap.clientWidth / 1920;
      iframe.style.width = '1920px';
      iframe.style.height = '1080px';
      iframe.style.transform = `scale(${scale})`;
    }, 100);
  });
</script>
</body>
</html>
