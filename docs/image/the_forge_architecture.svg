<svg width="720" viewBox="0 0 680 860" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
<title id="title">THE_FORGE 3-agent cycle architecture</title>
<desc id="desc">Planner, Generator, Evaluator의 3단계 사이클 구조와 각 단계의 입출력 파일</desc>

<style>
  .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 500; }
  .sub   { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 400; }
  @media (prefers-color-scheme: dark) {
    .gray-fill { fill: #444441; }
    .gray-stroke { stroke: #B4B2A9; }
    .gray-title { fill: #F1EFE8; }
    .gray-sub { fill: #D3D1C7; }
    .purple-fill { fill: #3C3489; }
    .purple-stroke { stroke: #AFA9EC; }
    .purple-title { fill: #EEEDFE; }
    .purple-sub { fill: #CECBF6; }
    .teal-fill { fill: #085041; }
    .teal-stroke { stroke: #5DCAA5; }
    .teal-title { fill: #E1F5EE; }
    .teal-sub { fill: #9FE1CB; }
    .amber-fill { fill: #633806; }
    .amber-stroke { stroke: #EF9F27; }
    .amber-title { fill: #FAEEDA; }
    .amber-sub { fill: #FAC775; }
    .arrow-stroke { stroke: #B4B2A9; }
  }
  @media (prefers-color-scheme: light), (prefers-color-scheme: no-preference) {
    .gray-fill { fill: #F1EFE8; }
    .gray-stroke { stroke: #5F5E5A; }
    .gray-title { fill: #2C2C2A; }
    .gray-sub { fill: #5F5E5A; }
    .purple-fill { fill: #EEEDFE; }
    .purple-stroke { stroke: #534AB7; }
    .purple-title { fill: #26215C; }
    .purple-sub { fill: #534AB7; }
    .teal-fill { fill: #E1F5EE; }
    .teal-stroke { stroke: #0F6E56; }
    .teal-title { fill: #04342C; }
    .teal-sub { fill: #0F6E56; }
    .amber-fill { fill: #FAEEDA; }
    .amber-stroke { stroke: #854F0B; }
    .amber-title { fill: #412402; }
    .amber-sub { fill: #854F0B; }
    .arrow-stroke { stroke: #5F5E5A; }
  }
</style>

<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<!-- 사용자 요청 -->
<rect x="180" y="30" width="320" height="50" rx="8" class="gray-fill gray-stroke" stroke-width="0.5"/>
<text class="title gray-title" x="340" y="52" text-anchor="middle" dominant-baseline="central">사용자 요청</text>
<text class="sub gray-sub" x="340" y="68" text-anchor="middle" dominant-baseline="central">"LangGraph 에이전트 만들어줘"</text>
<line x1="340" y1="80" x2="340" y2="110" class="arrow-stroke" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- Planner -->
<rect x="40" y="110" width="600" height="180" rx="14" class="purple-fill purple-stroke" stroke-width="0.5"/>
<text class="title purple-title" x="340" y="138" text-anchor="middle" dominant-baseline="central">Planner</text>
<text class="sub purple-sub" x="340" y="156" text-anchor="middle" dominant-baseline="central">subprocess · claude -p --agent planner</text>

<rect x="60" y="180" width="180" height="94" rx="8" class="purple-fill purple-stroke" stroke-width="0.5"/>
<text class="title purple-title" x="150" y="204" text-anchor="middle" dominant-baseline="central">Mode A · 생성</text>
<text class="sub purple-sub" x="150" y="226" text-anchor="middle" dominant-baseline="central">in: 요청, INDEX.md</text>
<text class="sub purple-sub" x="150" y="244" text-anchor="middle" dominant-baseline="central">out: spec.md,</text>
<text class="sub purple-sub" x="150" y="260" text-anchor="middle" dominant-baseline="central">specs/*</text>

<rect x="250" y="180" width="180" height="94" rx="8" class="purple-fill purple-stroke" stroke-width="0.5"/>
<text class="title purple-title" x="340" y="204" text-anchor="middle" dominant-baseline="central">Mode B · 리뷰</text>
<text class="sub purple-sub" x="340" y="226" text-anchor="middle" dominant-baseline="central">in: spec.md, specs/*</text>
<text class="sub purple-sub" x="340" y="244" text-anchor="middle" dominant-baseline="central">out: plan-review.md</text>
<text class="sub purple-sub" x="340" y="260" text-anchor="middle" dominant-baseline="central">(READY / NEEDS_REV)</text>

<rect x="440" y="180" width="180" height="94" rx="8" class="purple-fill purple-stroke" stroke-width="0.5"/>
<text class="title purple-title" x="530" y="204" text-anchor="middle" dominant-baseline="central">Mode C · Contract</text>
<text class="sub purple-sub" x="530" y="226" text-anchor="middle" dominant-baseline="central">in: spec, progress-log</text>
<text class="sub purple-sub" x="530" y="244" text-anchor="middle" dominant-baseline="central">out: sprint-contract.md</text>
<text class="sub purple-sub" x="530" y="260" text-anchor="middle" dominant-baseline="central">(YAML frontmatter)</text>

<line x1="340" y1="290" x2="340" y2="325" class="arrow-stroke" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- Generator -->
<rect x="40" y="325" width="600" height="220" rx="14" class="teal-fill teal-stroke" stroke-width="0.5"/>
<text class="title teal-title" x="340" y="353" text-anchor="middle" dominant-baseline="central">Generator</text>
<text class="sub teal-sub" x="340" y="371" text-anchor="middle" dominant-baseline="central">interactive · stdin/stdout 직접 연결</text>

<rect x="60" y="390" width="280" height="140" rx="8" class="teal-fill teal-stroke" stroke-width="0.5"/>
<text class="title teal-title" x="200" y="410" text-anchor="middle" dominant-baseline="central">세션 시작 시 읽기</text>
<text class="sub teal-sub" x="200" y="432" text-anchor="middle" dominant-baseline="central">1. progress-log.md</text>
<text class="sub teal-sub" x="200" y="448" text-anchor="middle" dominant-baseline="central">2. spec.md</text>
<text class="sub teal-sub" x="200" y="464" text-anchor="middle" dominant-baseline="central">3. specs/*.md (관련만)</text>
<text class="sub teal-sub" x="200" y="480" text-anchor="middle" dominant-baseline="central">4. sprint-contract.md</text>
<text class="sub teal-sub" x="200" y="496" text-anchor="middle" dominant-baseline="central">5. qa-report.md (있으면)</text>
<text class="sub teal-sub" x="200" y="512" text-anchor="middle" dominant-baseline="central">6. git log --oneline -10</text>

<rect x="350" y="390" width="270" height="140" rx="8" class="teal-fill teal-stroke" stroke-width="0.5"/>
<text class="title teal-title" x="485" y="410" text-anchor="middle" dominant-baseline="central">작업 중 · 종료 시</text>
<text class="sub teal-sub" x="485" y="432" text-anchor="middle" dominant-baseline="central">src/, tests/ 작성</text>
<text class="sub teal-sub" x="485" y="448" text-anchor="middle" dominant-baseline="central">decisions/*.md 기록</text>
<text class="sub teal-sub" x="485" y="464" text-anchor="middle" dominant-baseline="central">sprint-contract [x] 체크</text>
<text class="sub teal-sub" x="485" y="488" text-anchor="middle" dominant-baseline="central">종료 시 필수:</text>
<text class="sub teal-sub" x="485" y="504" text-anchor="middle" dominant-baseline="central">progress-log.md 맨 위에</text>
<text class="sub teal-sub" x="485" y="520" text-anchor="middle" dominant-baseline="central">세션 기록 추가</text>

<line x1="340" y1="545" x2="340" y2="580" class="arrow-stroke" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- Evaluator -->
<rect x="40" y="580" width="600" height="240" rx="14" class="amber-fill amber-stroke" stroke-width="0.5"/>
<text class="title amber-title" x="340" y="608" text-anchor="middle" dominant-baseline="central">Evaluator</text>
<text class="sub amber-sub" x="340" y="626" text-anchor="middle" dominant-baseline="central">subprocess · claude -p --agent evaluator</text>

<rect x="60" y="645" width="280" height="160" rx="8" class="amber-fill amber-stroke" stroke-width="0.5"/>
<text class="title amber-title" x="200" y="665" text-anchor="middle" dominant-baseline="central">입력</text>
<text class="sub amber-sub" x="200" y="687" text-anchor="middle" dominant-baseline="central">spec.md (전체 이해)</text>
<text class="sub amber-sub" x="200" y="703" text-anchor="middle" dominant-baseline="central">sprint-contract.md</text>
<text class="sub amber-sub" x="200" y="719" text-anchor="middle" dominant-baseline="central">specs/*.md</text>
<text class="sub amber-sub" x="200" y="735" text-anchor="middle" dominant-baseline="central">progress-log.md</text>
<text class="sub amber-sub" x="200" y="751" text-anchor="middle" dominant-baseline="central">src/, tests/ (Glob+Read)</text>
<text class="sub amber-sub" x="200" y="767" text-anchor="middle" dominant-baseline="central">pytest · lint · 타입 체크</text>
<text class="sub amber-sub" x="200" y="783" text-anchor="middle" dominant-baseline="central">실행 결과</text>

<rect x="350" y="645" width="270" height="160" rx="8" class="amber-fill amber-stroke" stroke-width="0.5"/>
<text class="title amber-title" x="485" y="665" text-anchor="middle" dominant-baseline="central">출력 · qa-report.md</text>
<text class="sub amber-sub" x="485" y="687" text-anchor="middle" dominant-baseline="central">종합 판정: PASS / FAIL</text>
<text class="sub amber-sub" x="485" y="707" text-anchor="middle" dominant-baseline="central">점수 (FAIL 임계값):</text>
<text class="sub amber-sub" x="485" y="723" text-anchor="middle" dominant-baseline="central">기능 X/10 (&lt;6)</text>
<text class="sub amber-sub" x="485" y="739" text-anchor="middle" dominant-baseline="central">코드 X/10 (&lt;5)</text>
<text class="sub amber-sub" x="485" y="755" text-anchor="middle" dominant-baseline="central">테스트 X/10 (&lt;4)</text>
<text class="sub amber-sub" x="485" y="771" text-anchor="middle" dominant-baseline="central">명세 X/10 (&lt;6)</text>
<text class="sub amber-sub" x="485" y="791" text-anchor="middle" dominant-baseline="central">항목별 근거(파일:라인)</text>
</svg>
